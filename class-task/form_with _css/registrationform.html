<html>

<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="red.css">
</head>

<body>

<header>
    <img src="logo.jpg" width="100%" height="120">
</header>

<div class="registration-content">
    <div class="registration-box">

        <h1>Registration Form</h1>

        <form action="thankyou.html">

            <div class="registration-row">
                <label>Login Name:</label>
                <input type="text" name="username" required>
            </div>

            <div class="registration-row">
                <label>Enter Password:</label>
                <input type="password" name="password" required>
            </div>

            <div class="registration-row">
                <label>Re-enter Password:</label>
                <input type="password" name="repassword" required>
            </div>

            <div class="registration-row">
                <label>Gender:</label>
                <div class="gender-options">
                    <input type="radio" name="gender" value="Male"> Male
                    <input type="radio" name="gender" value="Female"> Female
                </div>
            </div>

            <div class="registration-row">
                <label>Country:</label>
                <select name="country">
                    <option>Pakistan</option>
                    <option>India</option>
                    <option>China</option>
                </select>
            </div>

            <div class="registration-row">
                <label>License:</label>
                <textarea rows="4" cols="25">The information provided on this website is accurate. All information has been added</textarea>
            </div>

            <div class="registration-row">
                <label></label>
                <div>
                    <input type="checkbox" required> I agree with this license
                </div>
            </div>

           <div class="registration-button">
             <button type="submit" class="action-button">Register</button>
           </div>

        </form>

    </div>
</div>

<footer class="site-footer">
    Fatima Jinnah Women University, The Mall Road
</footer>

</body>
</html>
