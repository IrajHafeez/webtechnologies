    :root {

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {

      color: var(--text);
      background: var(--page-bg);

    a { color: inherit; text-decoration: none; }

    .nav {

      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .nav .container { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
    .logo { font-weight: 800; color: var(--primary-dark); }

    .nav-links a:hover { color: var(--primary); }

    /* ---------- Hero ---------- */
    .hero {

      background: linear-gradient(130deg, var(--primary-dark), var(--primary));

    .back { display: inline-block; margin-bottom: 8px; font-size: 0.92rem; font-weight: 700; color: var(--primary); }
    .back:hover { text-decoration: underline; }
